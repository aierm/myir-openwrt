name: Build MYiR RZ/G2L Firmware

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/myir-rzg2l-build.yml'
      - 'README-MyIR-RZG2L-OpenWrt-6.12.md'
      - 'include/kernel-defaults.mk'
      - 'configs/myir-rzg2l/**'
      - 'package/kernel/mac80211/patches/build/510-fix-scan-build-on-kernel-6.12.patch'
      - 'package/kernel/mac80211/patches/build/511-fix-reg-faux-device-fallback-on-kernel-6.12.patch'
      - 'package/network/config/netifd/patches/**'
      - 'scripts/prepare-myir-config.sh'
      - 'package/system/ubus/patches/**'
      - 'target/linux/renesas/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - proxy-zh

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      MYIR_PROFILE: ${{ github.event.inputs.profile || 'minimal' }}

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update

      - name: Checkout OpenWrt tree
        uses: actions/checkout@v6
        with:
          path: openwrt
          fetch-depth: 1

      - name: Checkout external kernel tree
        uses: actions/checkout@v6
        with:
          repository: aierm/myir-rz-linux-cip
          ref: rz-6.12-cip7
          path: rz_linux-cip
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-docutils \
            python3-ply rsync unzip zlib1g-dev file wget subversion swig time \
            device-tree-compiler ccache qemu-utils

      - name: Enable optional custom feeds
        working-directory: openwrt
        run: |
          if [ "$MYIR_PROFILE" = "proxy-zh" ]; then
            cat "$GITHUB_WORKSPACE/openwrt/configs/myir-rzg2l/feeds/proxy.feeds" >> feeds.conf.default
          fi

      - name: Show checkout layout
        run: |
          pwd
          ls -la
          test -d openwrt
          test -d rz_linux-cip

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare defconfig
        working-directory: openwrt
        run: |
          chmod +x scripts/prepare-myir-config.sh
          ./scripts/prepare-myir-config.sh "$MYIR_PROFILE"
          sed -i "s|^CONFIG_EXTERNAL_KERNEL_TREE=.*|CONFIG_EXTERNAL_KERNEL_TREE=\"$GITHUB_WORKSPACE/rz_linux-cip\"|" .config
          make defconfig
          echo "Using profile: $MYIR_PROFILE"
          grep '^CONFIG_EXTERNAL_KERNEL_TREE=' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Record artifact paths
        working-directory: openwrt
        run: |
          TARGET_DIR="$PWD/bin/targets/renesas/armv8"
          test -d "$TARGET_DIR"
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          find "$TARGET_DIR" -maxdepth 2 -type f | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myir-rzg2l-firmware-${{ github.sha }}
          path: |
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-ext4-sdcard.img.gz
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-ext4-sdcard.img
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-device-tree.dtb
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi.manifest
            ${{ env.TARGET_DIR }}/sha256sums
            ${{ env.TARGET_DIR }}/*buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-ext4-sdcard.img.gz
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-ext4-sdcard.img
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi-device-tree.dtb
            ${{ env.TARGET_DIR }}/openwrt-renesas-armv8-myir_mys_rzg2l_wifi.manifest
            ${{ env.TARGET_DIR }}/sha256sums
            ${{ env.TARGET_DIR }}/*buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
